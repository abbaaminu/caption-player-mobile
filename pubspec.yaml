name: premium_live_caption
description: A video player with live speech recognition captions for phones and web.
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.2.0
  http: ^1.6.0
  video_player: ^2.8.2
  speech_to_text: ^7.4.0
  flutter_secure_storage: ^11.2.0
  app_links: ^6.3.2 # Replaced discontinued uni_links
  permission_handler: ^11.3.1
  url_launcher: ^6.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png