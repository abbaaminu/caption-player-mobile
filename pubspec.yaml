name: live_caption_player
description: >-
  Live Caption Player plays local video and audio files while generating
  on-screen live captions. Available on Android, iOS, and the web.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  app_links: ^6.3.2
  cupertino_icons: ^1.0.8
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  speech_to_text: ^7.4.0
  url_launcher: ^6.1.12
  video_player: ^2.8.2
  web: ^1.1.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  image_path_ios: "assets/app_icon.png"
  image_path_android: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png