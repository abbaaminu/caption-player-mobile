name: live_caption_player
description: >-
  Live Caption Player plays local video and audio files while generating
  on-screen live captions. Available on Android, iOS, and the web.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  app_links: ^7.2.2
  cupertino_icons: ^2.0.0
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_whisper_ggml: ^0.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  web: ^1.1.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  image_path_ios: "assets/app_icon.png"
  image_path_android: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png