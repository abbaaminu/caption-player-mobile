<!doctype html>
<html>
<head><meta charset="utf-8"><title>probe timing</title></head>
<body><pre id="out">starting</pre>
<script>
// Measures how the whisper.cpp WebAssembly build scales with the length of the
// audio window. Live captions can only keep up if a window costs less than the
// audio it covers, so this decides whether the player may transcribe as it
// plays or has to prepare captions first.
const out = document.getElementById('out');
function log(message) {
  out.textContent += '\n' + message;
  console.log(message);
}
const ASSETS = 'assets/packages/flutter_whisper_ggml/assets/web';
const MODEL = 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin';

function request(worker, command, payload, onEvent) {
  return new Promise((resolve, reject) => {
    const id = Math.floor(Math.random() * 1e9);
    const handler = (event) => {
      const data = event.data;
      if (!data || data.id !== id) return;
      if (data.event) {
        if (onEvent) onEvent(data);
        return;
      }
      worker.removeEventListener('message', handler);
      if (data.ok) resolve(data); else reject(new Error(data.error));
    };
    worker.addEventListener('message', handler);
    worker.postMessage({ id, command, ...payload });
  });
}

async function decodeTo16k(url) {
  const response = await fetch(url);
  const data = await response.arrayBuffer();
  const context = new AudioContext();
  const decoded = await context.decodeAudioData(data);
  const channels = [];
  for (let c = 0; c < decoded.numberOfChannels; c++) {
    channels.push(decoded.getChannelData(c));
  }
  const step = decoded.sampleRate / 16000;
  const length = Math.ceil(decoded.duration * 16000);
  const output = new Float32Array(length);
  const last = channels[0].length - 1;
  for (let i = 0; i < length; i++) {
    const position = i * step;
    const base = Math.min(Math.floor(position), last);
    const next = Math.min(base + 1, last);
    const fraction = position - base;
    let mixed = 0;
    for (const channel of channels) {
      mixed += channel[base] + (channel[next] - channel[base]) * fraction;
    }
    output[i] = Math.max(-1, Math.min(1, mixed / channels.length));
  }
  await context.close();
  return { samples: output, duration: decoded.duration };
}

(async () => {
  try {
    const audio = await decodeTo16k('probe.wav');
    log('decoded duration=' + audio.duration.toFixed(2)
      + ' samples=' + audio.samples.length);

    const worker = new Worker(ASSETS + '/flutter_whisper_worker.js');
    worker.addEventListener('error', (event) => log('worker error: ' + (event.message || event)));
    const started = performance.now();
    await request(worker, 'init', {
      modelUrl: MODEL,
      moduleUrl: new URL(ASSETS + '/flutter_whisper.js', location.href).href,
      useGpu: false,
      gpuDevice: 0,
      flashAttention: false,
    });
    log('init ok in ' + Math.round(performance.now() - started) + 'ms');

    function slice(startSeconds, lengthSeconds) {
      const from = Math.max(0, Math.floor(startSeconds * 16000));
      const to = Math.min(audio.samples.length, from + Math.round(lengthSeconds * 16000));
      return audio.samples.slice(from, to);
    }

    const cases = [
      { name: 'auto-5s', language: 'auto', seconds: 5 },
      { name: 'en-2s', language: 'en', seconds: 2 },
      { name: 'en-5s', language: 'en', seconds: 5 },
      { name: 'en-8s', language: 'en', seconds: 8 },
      { name: 'en-11s', language: 'en', seconds: 11 },
    ];

    for (const item of cases) {
      const samples = slice(0, item.seconds);
      const caseStarted = performance.now();
      try {
        const response = await request(worker, 'transcribe', {
          samples,
          config: {
            language: item.language,
            translate: false,
            threads: 2,
            tokenTimestamps: false,
            noContext: true,
            singleSegment: false,
            initialPrompt: '',
            temperature: 0,
          },
        });
        const elapsed = Math.round(performance.now() - caseStarted);
        const text = (response.result || '').slice(0, 220);
        log('[' + item.name + '] ' + elapsed + 'ms for '
          + (samples.length / 16000).toFixed(1) + 's audio ('
          + (elapsed / 1000 / (samples.length / 16000)).toFixed(2)
          + 'x realtime) ' + text);
      } catch (error) {
        log('[' + item.name + '] FAILED: ' + (error && error.message ? error.message : String(error)));
      }
    }
    log('DONE');
  } catch (error) {
    log('FAILED: ' + (error && error.message ? error.message : String(error)));
  }
})();
</script>
</body>
</html>
